# ── Server ──────────────────────────────────────────────────────────────────
# The port your backend listens on. Frontend calls http://localhost:8080
server.port=8080

# ── App info ─────────────────────────────────────────────────────────────────
spring.application.name=antigravity-backend

# ── Logging ──────────────────────────────────────────────────────────────────
